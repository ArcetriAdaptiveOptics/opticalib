# Read the Docs configuration
# See https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # Install the project itself (without its runtime dependencies, which are
    # pinned separately in docs/requirements.txt).  Without this step
    # ``import opticalib`` fails during the build and every autodoc page comes
    # out empty.
    post_install:
      - pip install --no-deps --no-build-isolation -e .

sphinx:
  configuration: docs/conf.py
  # The build is warning-free under ``sphinx-build -W`` (verified locally), so
  # regressions cannot reach the published site.  If this starts failing, see
  # ``docs/developer_guide/documentation`` for the known pitfalls.
  fail_on_warning: true

formats:
  - pdf
  - epub

python:
  install:
    - requirements: docs/requirements.txt
