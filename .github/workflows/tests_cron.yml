name: Tests (weekly)

# Runs the whole test workflow (tests.yml) every week, so that a new release
# of a dependency that breaks opticalib is caught even without pushes. The
# called workflow skips the pip cache on scheduled runs: every package is
# downloaded afresh.
on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
