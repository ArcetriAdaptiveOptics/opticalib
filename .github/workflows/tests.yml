name: Tests

on:
  push:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: "0 8 * * 1"

jobs:
  pytest:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # The GUI tests run on a real (virtual) X display, started by the "Start the
    # virtual display" step below, instead of the Qt "offscreen" platform:
    # offscreen has no window system, no real fonts and unreliable widget
    # geometry, which is what made the graphical tests fail at random on some
    # runners.
    env:
      DISPLAY: ":99"
      QT_QPA_PLATFORM: xcb
      # No GPU on the runner: keep Mesa on its software rasteriser.
      LIBGL_ALWAYS_SOFTWARE: "1"
      # With a DISPLAY set, pyplot would pick an interactive Qt backend and a
      # stray plt.show() (opticalib.analyzer) would block the run forever.
      MPLBACKEND: Agg
      # No session bus either: forbid the dbus auto-launch, which can stall the
      # creation of the first Qt window.
      DBUS_SESSION_BUS_ADDRESS: "disabled:"

    strategy:
      fail-fast: false
      matrix:
        python-version:
          # - "3.10"  # Disabled because QT tests
          # - "3.11"  # don't work on GH Runners
          - "3.12"
          - "3.13.12"
          - "3.x"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Qt/X11 system libraries (GUI tests)
        # PySide6 needs the whole X11/xcb + OpenGL/EGL stack to start on a
        # display; without it the graphical tests are skipped (missing
        # libEGL.so.1, libxcb-cursor.so.0, ...) or abort the interpreter.
        # Xvfb is the display itself, x11-utils probes it, and the font
        # packages give Qt stable text metrics (without them Qt falls back to
        # an unnamed font and every sizeHint/elided text changes).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils \
            libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri libgles2 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libfreetype6 \
            fonts-dejavu-core fonts-liberation \
            libdbus-1-3 \
            libx11-6 libx11-xcb1 libxext6 libxfixes3 libxi6 libxrender1 \
            libice6 libsm6 \
            libxcb1 libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

      - name: Start the virtual display (Xvfb)
        # 1920x1080x24 with no access control: the CalpyGUI window, its docks
        # and dialogs must fit on the screen, otherwise the layout the tests
        # inspect is not the real one. The server runs as the runner user (so
        # its X11 socket is connectable by pytest) and stays up for the job.
        run: |
          sudo mkdir -p /tmp/.X11-unix
          sudo chmod 1777 /tmp/.X11-unix
          Xvfb "$DISPLAY" -screen 0 1920x1080x24 -ac +extension GLX +render -noreset \
            > /tmp/xvfb.log 2>&1 &
          for _ in $(seq 1 30); do
            if xdpyinfo -display "$DISPLAY" > /dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! xdpyinfo -display "$DISPLAY" > /tmp/xdpyinfo.txt 2>&1; then
            echo "::error::Xvfb is not answering on DISPLAY=$DISPLAY"
            cat /tmp/xvfb.log
            exit 1
          fi
          head -6 /tmp/xdpyinfo.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude ./scripts --exit-zero --max-complexity=10 --max-line-length=127


      - name: Check the Qt GUI stack
        # Fail fast, with a clear message, if Qt cannot draw on the virtual
        # display: the graphical tests must never silently disappear from the
        # run (they are skipped when PySide6/qtpy cannot be imported).
        run: |
          python - <<'PY'
          import opticalib.gui  # noqa: F401  (selects the default Qt binding)
          from qtpy.QtWidgets import QApplication, QLabel

          app = QApplication([])
          label = QLabel("opticalib")
          label.show()
          app.processEvents()
          print("Qt platform :", app.platformName())
          print("screens     :", [s.name() for s in app.screens()])
          print("font        :", app.font().family())
          pixmap = label.grab()
          assert app.platformName() == "xcb", app.platformName()
          assert not pixmap.isNull() and pixmap.width() > 0
          print("GUI stack OK: the graphical tests will run")
          PY

      - name: Run pytest
        # The GUI tests inherit DISPLAY/QT_QPA_PLATFORM from the job and draw on
        # the virtual display (tests/test_gui_app.py pins "offscreen" for its
        # own subprocess, which needs no display).
        shell: bash  # -eo pipefail: the exit status of pytest survives `tee`
        run: |
          pip install pytest pytest-cov
          pytest --cov=opticalib -rs 2>&1 | tee pytest.log

      - name: Check that the GUI tests really ran
        # A skipped graphical test means the Qt stack is incomplete again.
        if: always() && hashFiles('pytest.log') != ''
        run: |
          skipped=$(grep -cE '^SKIPPED .*tests/(test_gui_|conftest\.py)' pytest.log || true)
          executed=$(grep -cE '^tests/test_gui_.* (PASSED|FAILED|ERROR)' pytest.log || true)
          echo "GUI tests executed: $executed"
          if [ "$skipped" -ne 0 ]; then
            echo "::error::$skipped GUI skip reason(s): the Qt/X11 stack is incomplete"
            grep -E '^SKIPPED' pytest.log
            exit 1
          fi
          if [ "$executed" -eq 0 ]; then
            echo "::error::no GUI test was executed"
            exit 1
          fi

