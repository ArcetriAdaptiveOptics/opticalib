name: Tests

on:
  push:
  workflow_dispatch:
  # tests_cron.yml runs this same workflow every week (without the pip cache).
  workflow_call:

# Every job installs opticalib into its own virtual environment
# ($RUNNER_TEMP/venv), never into the interpreter of actions/setup-python.
# On GitHub each job gets a fresh VM, so this changes nothing there. Under
# `act` it matters: /opt/hostedtoolcache is a Docker volume shared by every
# job, every run and every repository. Packages installed there by one job
# (PySide6 from the GUI job, an editable rbfgpu from another project's run)
# leak into all the others, and jobs running in parallel on the same Python
# version pip-install into the same site-packages at the same time.

env:
  # With a DISPLAY set, pyplot would pick an interactive Qt backend and a
  # stray plt.show() (opticalib.analyzer) would block the run forever.
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test_no_gui:
    name: Pytest (Python ${{ matrix.python-version }} - no GUI)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The latest CPython ("3.x") is a canary: it may run before every
    # dependency publishes wheels for it, so it must not fail the workflow.
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11" # minimum version
          - "3.14" # latest version supported by every dependency
        experimental: [false]
        include:
          - python-version: "3.x" # latest CPython release
            experimental: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install HDF5 headers (latest Python only)
        # A new CPython can come out before h5py publishes wheels for it;
        # pip then builds h5py from source, which needs the HDF5 library.
        if: matrix.experimental
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libhdf5-dev pkg-config

      - name: Create the virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Cache pip downloads
        # The weekly run (schedule) deliberately downloads everything afresh.
        if: github.event_name != 'schedule'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-nogui-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-nogui-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install flake8
          python -c "import sys; print(sys.prefix)"

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude ./scripts,./build --exit-zero --max-complexity=10 --max-line-length=127

      - name: Run pytest
        shell: bash  # -eo pipefail: the exit status of pytest survives `tee`
        run: |
          pytest --cov=opticalib -rs --verbosity=1 2>&1 | tee "$RUNNER_TEMP/pytest.log"

  test_gui:
    name: Pytest (Python ${{ matrix.python-version }} - GUI)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true

    # The GUI tests run on a real (virtual) X display, started by the "Start the
    # virtual display" step below, instead of the Qt "offscreen" platform:
    # offscreen has no window system, no real fonts and unreliable widget
    # geometry, which is what made the graphical tests fail at random on some
    # runners.
    env:
      DISPLAY: ":99"
      QT_QPA_PLATFORM: xcb
      # No GPU on the runner: keep Mesa on its software rasteriser.
      LIBGL_ALWAYS_SOFTWARE: "1"
      # No session bus either: forbid the dbus auto-launch, which can stall the
      # creation of the first Qt window.
      DBUS_SESSION_BUS_ADDRESS: "disabled:"

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"  # test minimum version
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt/X11 system libraries (GUI tests)
        # PySide6 needs the whole X11/xcb + OpenGL/EGL stack to start on a
        # display; without it the graphical tests are skipped (missing
        # libEGL.so.1, libxcb-cursor.so.0, ...) or abort the interpreter.
        # Xvfb is the display itself, x11-utils probes it, and the font
        # packages give Qt stable text metrics (without them Qt falls back to
        # an unnamed font and every sizeHint/elided text changes).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils \
            libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri libgles2 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libfreetype6 \
            fonts-dejavu-core fonts-liberation \
            libdbus-1-3 \
            libx11-6 libx11-xcb1 libxext6 libxfixes3 libxi6 libxrender1 \
            libice6 libsm6 \
            libxcb1 libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

      - name: Start the virtual display (Xvfb)
        # 1920x1080x24 with no access control: the CalpyGUI window, its docks
        # and dialogs must fit on the screen, otherwise the layout the tests
        # inspect is not the real one. The server runs as the runner user (so
        # its X11 socket is connectable by pytest) and stays up for the job.
        run: |
          sudo mkdir -p /tmp/.X11-unix
          sudo chmod 1777 /tmp/.X11-unix
          Xvfb "$DISPLAY" -screen 0 1920x1080x24 -ac +extension GLX +render -noreset \
            > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          for _ in $(seq 1 30); do
            if xdpyinfo -display "$DISPLAY" > /dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! xdpyinfo -display "$DISPLAY" > "$RUNNER_TEMP/xdpyinfo.txt" 2>&1; then
            echo "::error::Xvfb is not answering on DISPLAY=$DISPLAY"
            cat "$RUNNER_TEMP/xvfb.log"
            exit 1
          fi
          head -6 "$RUNNER_TEMP/xdpyinfo.txt"

      - name: Create the virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Cache pip downloads
        # The weekly run (schedule) deliberately downloads everything afresh.
        if: github.event_name != 'schedule'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-gui-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-gui-

      - name: Install dependencies
        # PySide6 6.12.0 over-releases None when QTimer.singleShot(0, obj.method)
        # fires after obj's C++ object was deleted (opticalib.gui.activity does
        # this): on Python < 3.12, where None is not immortal, the interpreter
        # aborts with "none_dealloc: deallocating None". Remove the pin once a
        # fixed PySide6 is out.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,test]" "PySide6-Essentials<6.12; python_version < '3.12'"
          pip install flake8
          python -c "import sys; print(sys.prefix)"

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude ./scripts,./build --exit-zero --max-complexity=10 --max-line-length=127

      - name: Check the Qt GUI stack
        # Fail fast, with a clear message, if Qt cannot draw on the virtual
        # display: the graphical tests must never silently disappear from the
        # run (they are skipped when PySide6/qtpy cannot be imported).
        run: |
          python - <<'PY'
          import opticalib.gui  # noqa: F401  (selects the default Qt binding)
          from qtpy.QtWidgets import QApplication, QLabel

          app = QApplication([])
          label = QLabel("opticalib")
          label.show()
          app.processEvents()
          print("Qt platform :", app.platformName())
          print("screens     :", [s.name() for s in app.screens()])
          print("font        :", app.font().family())
          pixmap = label.grab()
          assert app.platformName() == "xcb", app.platformName()
          assert not pixmap.isNull() and pixmap.width() > 0
          print("GUI stack OK: the graphical tests will run")
          PY

      - name: Run pytest
        # The GUI tests inherit DISPLAY/QT_QPA_PLATFORM from the job and draw on
        # the virtual display (tests/test_gui_app.py pins "offscreen" for its
        # own subprocess, which needs no display). --verbosity=1 prints each
        # test id before running it, so a hard crash (Qt abort) shows the culprit.
        shell: bash  # -eo pipefail: the exit status of pytest survives `tee`
        run: |
          pytest --cov=opticalib -rs --verbosity=1 \
            --junitxml="$RUNNER_TEMP/pytest-results.xml" \
            2>&1 | tee "$RUNNER_TEMP/pytest.log"

      - name: Check that the GUI tests really ran
        # A skipped graphical test means the Qt stack is incomplete again.
        if: ${{ !cancelled() }}
        run: |
          python - "$RUNNER_TEMP/pytest-results.xml" <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET

          report = sys.argv[1]
          if not os.path.isfile(report):
              print("::error::pytest wrote no report: it crashed before the end of the run")
              sys.exit(1)
          def ident(case):
              # A module skipped at import (pytest.importorskip) is reported
              # as classname="" name="tests.test_gui_x", a test as
              # classname="tests.test_gui_x" name="test_y".
              return ".".join(p for p in (case.get("classname"), case.get("name")) if p)

          cases = [
              c for c in ET.parse(report).getroot().iter("testcase")
              if ident(c).startswith("tests.test_gui_")
          ]
          skipped = [c for c in cases if c.find("skipped") is not None]
          executed = len(cases) - len(skipped)
          print(f"GUI tests executed: {executed}, skipped: {len(skipped)}")
          for c in skipped:
              print(f"  SKIPPED {ident(c)}: {c.find('skipped').text}")
          if skipped:
              print(f"::error::{len(skipped)} GUI test(s) skipped: the Qt/X11 stack is incomplete")
              sys.exit(1)
          if executed == 0:
              print("::error::no GUI test was executed")
              sys.exit(1)
          PY
