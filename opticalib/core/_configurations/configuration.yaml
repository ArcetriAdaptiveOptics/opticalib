######################################
## Configuration file for Opticalib ##
######################################

SYSTEM:
  data_path: ''
  version: '2.4'
  created_with: ''

## Devices configuration ##
# In this section you can add the configuration of your devices.
# Follow the examples provided below, as they show the type of
# devices implemented as of now.
DEVICES:
  # In the wavefront sensor section can be defined any Wavefront sensor used to
  # acquire phase maps.
  WFS:
    Ingot:
      camera: CAMERAS:GigaVision
      camera_base_exptime: #in ms
      camera_fps:  # frames per second for the camera (if supported)
      camera_binning:  # binning factor of the camera (software)
      sigma_threshold:  # sigma threshold for the edge filter (Canny algorythm) 
      n_pupils:  # number of total pupils
      subapertures:  # number of pixels across the pupil
      delta_r: # delta px for pupil search range, centered on subapertures
      pupils_centers: # estimate of the pupil centers, to help the search
        - [0, 0]
        - [0, 0]
        - [0, 0]
    Pyramid:
      camera: CAMERAS:GigaVision
      camera_base_exptime:  #in ms
      camera_fps:  # frames per second for the camera (if supported)
      camera_binning:  # binning factor of the camera (software)
      sigma_threshold: # sigma threshold for the edge filter (Canny algorythm) 
      n_pupils: # number of total pupils
      subapertures:  # number of pixels across the pupil
      delta_r:  # delta px for pupil search range, centered on subapertures
      pupils_centers: # estimate of the pupil centers, to help the search
        - [0, 0]
        - [0, 0]
        - [0, 0]
        - [0, 0]

  INTERFEROMETERS:
    PhaseCamX:
      ip: 
      port: 
      Paths:
        settings: 
        copied_settings: 
        capture_4dpc: 
        produce_4dpc: 
        produce: 
        capture: 
    AccuFizX:
      ip: 
      port: 
      Paths:
        settings: 
        copied_settings: 
        capture_4dpc: 
        produce_4dpc: 
        produce: 
        capture: 
    4DProcesser1:
      ip: 
      port:
      Paths:
        settings:        
        copied_settings: 
        capture_4dpc: 
        produce_4dpc: 
        produce: 
        capture: 
  
  # The deformable mirrors section can be used to define wavefront correctors of
  # the system, such as DMs, SLMs, etc.
  DEFORMABLE.MIRRORS:
    AlpaoXXX:
      # AlpaoDM serial number, BAX<YYY>
      serial_number: 
      # Parent folder containing Lib64/ (e.g. .../Linux/Samples/Python3)
      sdk_folder_path: 
      # Folder containing the .acfg hardware config file (sets ACECFG env var)
      acfg_path: 
      # IP and PORT needed for the plico_dm backend
      plico_ip: 
      plico_port: 
      diameter: 
      slave_ids: []
      border_ids: []
    PetalDM:
      ip0: 
      ip1: 
      ip2: 
      ip3: 
      ip4: 
      ip5: 
      slave_ids: []
      border_ids: []

  # The cameras section can be used to define any kind of scientific CCD 
  CAMERAS:
    GigaVision: # example camera
      id: DEV_000F314DE425
      ip:
      buffer_size: # frames kept in memory while streaming (default 100)
  
# The motor devices usually use the `plico_motor` interface, as their SDK is 
# not implemented in Linux.
  MOTORS:
    TunableFilter: # via plico_motor
      ip: 
      port: 
    SomeMotor: # via plico_motor
      ip: 
      port: 

# Here you can specify what you expect to see in the frame of a SPL phasing sensor
# which is usually a camera plus a tunable filter (to be defined in the DEVICES
# section)
PHASING:
  camera: CAMERAS:GigaVision
  filter: MOTORS:TunableFilter
  expected_psfs: # number of different psfs to expect in the frame
  psfs_angles:  # degrees, w.r.t. the horizontal axis of the camera
  expected_psfs_pos: # expected coordinates of the PSFs, ordered as the angles. This is to better identify the correct centroids.
  - []
  - []
  - []
  - []
  - []
  - []
  initial_crop_half_size: # pixels, to be used for the first PSF detection, then refined with a photometric centroid detection
  crop_half_size: # pixels, final crop. If list, is y,x
  min_px_threshold:  # minimum number of pixels above the threshold to consider a PSF as detected
  sigma_threshold:  # number of sigma above the background to use as threshold for the detection

## Influence functions configuration ##
# Here you can set the parameters for the influence functions
# data acquisition and processing.
INFLUENCE.FUNCTIONS:
  timing: 1 
  sequential_delay: 0.0 # delay, in seconds, between te command application and the wfs acquisition
  triggered_mode: # if not available, put false and comment next 2 lines
    frequency: 5.
    cmd_delay: 0.0
  TRIGGER:
    trailing_zeros: 0 # 0s before the modes
    modes_list: [] # list of modes ids
    amplitude: 0.05 # amplitude of the applied modes
    template: [] # push-pull template
    modal_base: hadamard # modal basis 
  REGISTRATION:
    trailing_zeros: 0
    modes_list: []
    amplitude: 0.1
    template: []
    modal_base: zonal
  IFFUNC:
    trailing_zeros: 0
    padding_zeros: 5 # 0s after the modes
    modes_list: np.arange(0,88,1)
    amplitude: 0.05
    template: [1, -1, 1]
    shuffle: false # whether to shuffle the order of the modes
    n_repetitions: 1 # number of times to repeat the application of each mode
    modal_base: zonal

## Stitching configuration ##
# Here you can set the parameters for the stitching procedure.
STITCHING:
  motor: MOTORS:SomeMotor
  pixel_scale: 0.09095 # img pixel scale in mm/px
  alpha: 0 # rotation angle in degrees
  starting_coords: [0, 0] # motors position in mm
  home_coords: [0, 0] # motors position in mm

## System alignment configuration ##
# Here you can set the parameters for the system optical 
# alignment procedure.
# Filled, as example, with M4 OTT configuration
SYSTEM.ALIGNMENT:
  names:
  - Parabola
  - Reference Mirror
  - M4 Exapode

  devices_move_calls:
  - parabola.setPosition
  - referenceMirror.setPosition
  - m4Exapode.setPosition

  devices_read_calls:
  - parabola.getPosition
  - referenceMirror.getPosition
  - m4Exapode.getPosition

  ccd_acquisition:
  - acquire_map

  devices_dof: 6

  dof:
  - [2, 3, 4]        # Parabola DoF
  - [3, 4]           # Reference Mirror DoF
  - [3, 4]           # M4 Exapode DoF

  slices:
    # Parabola
  - start: 0
    stop: 3
    # Reference Mirror
  - start: 3
    stop: 5
    # M4 Exapode
  - start: 5
    stop: 7

  zernike_to_use: [1, 2, 3, 6, 7]
  push_pull_template: [1, -2, 1]
  commandMatrix: ottCmdMat.fits
  fitting_surface: ''
